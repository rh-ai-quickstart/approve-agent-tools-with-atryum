{{- if include "quickstart.modelEndpoint" . }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-model-access
  labels:
    {{- include "quickstart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test-model
      image: {{ .Values.configure.image }}
      envFrom:
        - secretRef:
            name: {{ .Release.Name }}-llm
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command: ["python3", "-c"]
      args:
        - |
          import json, os, sys, urllib.error, urllib.request

          body = {
              "model": os.environ["LLM_MODEL"],
              "messages": [{"role": "user", "content": "Say hello in one word."}],
              "max_tokens": 16,
          }
          request = urllib.request.Request(
              os.environ["LLM_BASE_URL"] + "/chat/completions",
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["LLM_API_KEY"],
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if not json.load(response).get("choices"):
                      sys.exit("Model endpoint returned no choices")
                  print("Model endpoint responded successfully")
          except urllib.error.HTTPError as error:
              sys.exit(f"Model endpoint returned HTTP {error.code}")
          except (urllib.error.URLError, TimeoutError, ValueError):
              sys.exit("Model endpoint could not be reached or returned an invalid response")
{{- end }}
