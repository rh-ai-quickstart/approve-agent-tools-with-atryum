{{- if .Values.demo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quickstart.demo" . }}
  labels:
    app.kubernetes.io/name: {{ include "quickstart.demo" . }}
    {{- include "quickstart.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "quickstart.demo" . }}
  ports:
    - name: dashboard
      port: 8000
      targetPort: dashboard
    - name: mcp
      port: 8001
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quickstart.demo" . }}
  labels:
    app.kubernetes.io/name: {{ include "quickstart.demo" . }}
    app.kubernetes.io/component: demo
    {{- include "quickstart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "quickstart.demo" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "quickstart.demo" . }}
        app.kubernetes.io/component: demo
        {{- include "quickstart.labels" . | nindent 8 }}
      annotations:
        checksum/model-secret: {{ include (print $.Template.BasePath "/llm-secret.yaml") . | sha256sum }}
        {{- if .Values.mcpGateway.enabled }}
        checksum/mcp-adapter: {{ .Files.Get "files/gateway_client.py" | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demos
          image: {{ include "quickstart.demoImage" . | quote }}
          imagePullPolicy: {{ .Values.demo.image.pullPolicy }}
          {{- if .Values.mcpGateway.enabled }}
          command:
            - bash
            - -ec
            - |
              /opt/venv/bin/python /app/server.py &
              /opt/venv/bin/python /mcp-adapter/gateway_client.py &
              trap 'kill $(jobs -pr) 2>/dev/null || true' EXIT
              trap 'exit 0' TERM INT
              wait -n
          volumeMounts:
            - name: mcp-adapter
              mountPath: /mcp-adapter
              readOnly: true
          {{- end }}
          ports:
            - name: dashboard
              containerPort: 8000
            - name: mcp
              containerPort: 8001
          env:
            {{- if .Values.mcpGateway.enabled }}
            # Both demos use the gateway for MCP traffic.
            - name: FINANCE_MCP_URL
              value: {{ printf "http://%s:8080/mcp" (include "quickstart.gatewayHost" .) | quote }}
            - name: GDPR_MCP_URL
              value: {{ printf "http://%s:8080/mcp" (include "quickstart.gatewayHost" .) | quote }}
            {{- else }}
            - name: ATRYUM_BASE
              value: "http://{{ include "quickstart.atryum" . }}:8080"
            {{- end }}
            - name: FINANCE_RESET_URL
              value: "http://127.0.0.1:8001/mcp/finance/reset"
            - name: GDPR_RESET_URL
              value: "http://127.0.0.1:8001/mcp/gdpr/reset"
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-llm
          readinessProbe:
            httpGet:
              path: /api/finance/agents
              port: dashboard
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.demo.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      {{- if .Values.mcpGateway.enabled }}
      volumes:
        - name: mcp-adapter
          configMap:
            name: {{ include "quickstart.gateway" . }}-adapter
      {{- end }}
{{- if .Values.demo.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "quickstart.demo" . }}
  labels:
    app.kubernetes.io/name: {{ include "quickstart.demo" . }}
    {{- include "quickstart.labels" . | nindent 4 }}
spec:
  {{- with (include "quickstart.demoHost" .) }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "quickstart.demo" . }}
  port:
    targetPort: dashboard
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
