# LLM configuration (required)
#
# One credential powers both Atryum's AI-evaluation judge and the demo agents.
#
# Option A: OpenAI — set model.api_key (and optionally model.name), leave
#           model.endpoint empty.
# Option B: Bring your own OpenAI-compatible model (MaaS, vLLM, an OpenShift AI
#           model server, …) — set name, endpoint, and api_key. The endpoint is
#           the base URL without the /v1 suffix (e.g. https://my-maas-instance:443);
#           a trailing /v1 is tolerated and stripped.
model:
  name: gpt-4o
  endpoint: ""
  api_key: ""
  # Judge provider is derived from endpoint (openai / openai_compatible);
  # set explicitly to override (e.g. "anthropic" — judge only, the demo
  # agents always speak the OpenAI API).
  provider: ""

# OpenShift apps wildcard domain (e.g. apps.my-cluster.example.com).
# The Makefile auto-detects it via:
#   oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'
# When empty, Routes let OpenShift pick the host and Atryum's public_base_url
# falls back to the in-cluster service URL (fine for the demo; OAuth-based MCP
# servers would need a real public URL).
clusterDomain: ""

# Opt in to an isolated, cluster-local Red Hat Connectivity Link MCP Gateway
# (0.7.x API). Install its Operator in the release namespace first.
mcpGateway:
  enabled: false
  gatewayClassName: openshift-default

atryum:
  image:
    repository: validmind/atryum
    # The seed Job uses the demo operator API behavior in this release.
    tag: "0.10.0"
    pullPolicy: IfNotPresent
  logLevel: info
  # Override Atryum's public URL outright (takes precedence over clusterDomain).
  publicBaseUrl: ""
  route:
    enabled: true
    host: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

postgres:
  image: quay.io/sclorg/postgresql-16-c9s:latest
  # Password is generated on first install and preserved across upgrades
  # (helm lookup); set explicitly to pin it.
  password: ""
  user: atryum
  database: atryum
  storage:
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

# The packaged finance + GDPR demo (dashboard on 8000, MCP servers on 8001).
demo:
  enabled: true
  image:
    repository: validmind/atryum-finance-demo
    tag: "latest"
    # Gateway mode defaults to the published image whose Python client the
    # adapter was built against. Override for a compatible rebuilt demo.
    digest: ""
    pullPolicy: Always
  route:
    enabled: true
    host: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Post-install/post-upgrade Job that seeds Atryum with the demo MCP servers,
# the six governed agents and their charters, the rule set, and the judge
# LLM config — via Atryum's REST API.
configure:
  enabled: true
  image: registry.access.redhat.com/ubi9/python-312:latest
